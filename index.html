<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Pond Sensor Atlas</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Source+Sans+3:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>

/* Layout: IWMI dark-blue header band (title, view tabs, data status) over a one-screen app — side panel (summary, filters, site list) beside the map; profile slides over the map. Phone: header, map, list; profile as a full sheet.
   Palette: IWMI brand guide — Dark Blue #28537D, Light Blue #5088C6, Sky Blue #46BBD4, Teal #0297A6, Green #22AD7A, Orange #E86933, Yellow #DD9103, Light Grey #E8E7E7. */
:root{
  --brand:#28537D; --brand-text:#28537D; --brand-ink:#ffffff; --brand-2:#5088C6; --sky:#46BBD4; --teal:#0297A6;
  --bg:#f3f3f2; --panel:#ffffff; --ink:#1b2b3a; --muted:#5e6b78; --line:#dcdde0;
  --land:#e8e7e7; --land-line:#c3c6cc; --sea:#e3edf5;
  --water:#28537D; --water-soft:#e4edf6;
  --sfo:#E86933; --baif:#22AD7A; --iwmi:#5088C6;
  --good:#1e9468; --warn:#b97802;
  --f-display:"DM Serif Text", Georgia, "Times New Roman", serif;
  --f-body:"Source Sans 3", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --brand:#1d3f61; --brand-text:#a9c8ec; --brand-ink:#ffffff; --brand-2:#7aa6da; --sky:#5fcbe1; --teal:#2fb5c4;
  --bg:#0f1823; --panel:#15212e; --ink:#e4ebf2; --muted:#9aa9b8; --line:#26364a;
  --land:#1a2836; --land-line:#34475c; --sea:#0b131c;
  --water:#7aa6da; --water-soft:#1b3048;
  --sfo:#f08a5d; --baif:#3fc795; --iwmi:#7aa6da; --good:#3fc795; --warn:#e8a92a;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --brand:#1d3f61; --brand-text:#a9c8ec; --brand-ink:#ffffff; --brand-2:#7aa6da; --sky:#5fcbe1; --teal:#2fb5c4;
  --bg:#0f1823; --panel:#15212e; --ink:#e4ebf2; --muted:#9aa9b8; --line:#26364a;
  --land:#1a2836; --land-line:#34475c; --sea:#0b131c;
  --water:#7aa6da; --water-soft:#1b3048;
  --sfo:#f08a5d; --baif:#3fc795; --iwmi:#7aa6da; --good:#3fc795; --warn:#e8a92a;
  color-scheme:dark}
[hidden]{display:none!important}
body{margin:0}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
*{box-sizing:border-box}
button,select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.shell{display:flex;flex-direction:column;height:100%}
.topbar{background:var(--brand);color:var(--brand-ink);position:relative;z-index:999;
  display:flex;align-items:center;gap:12px 28px;flex-wrap:wrap;
  padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--sky),var(--teal))}
.brand{display:grid;gap:1px;min-width:0}
.topbar .eyebrow{color:rgb(255 255 255 / .72)}
.topbar h1{color:var(--brand-ink)}
.topbar .tabs{background:rgb(255 255 255 / .1);border-color:rgb(255 255 255 / .18)}
.topbar .tab{color:rgb(255 255 255 / .82);min-width:96px}
.topbar .tab:hover{color:#fff}
.topbar .tab[aria-selected="true"]{background:#fff;color:#28537D}
.topbar .tab .n{background:var(--sky);color:#0d2a40}
.topbar .data-bar{margin-left:auto;color:rgb(255 255 255 / .8)}
.topbar .data-bar .src i{background:rgb(255 255 255 / .5)}
.topbar .data-bar .src.live i{background:#5fe0a8}
.topbar .btn{background:transparent;border-color:rgb(255 255 255 / .45);color:#fff}
.topbar .btn:hover{background:rgb(255 255 255 / .12);border-color:#fff}
.topbar :focus-visible{outline-color:var(--sky)}
.app{display:grid;grid-template-columns:minmax(320px,380px) 1fr;flex:1;min-height:0;overflow:hidden}
.side{display:flex;flex-direction:column;min-height:0;background:var(--panel);border-right:1px solid var(--line)}
.side-head{padding-block:18px 14px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px;border-bottom:1px solid var(--line);display:grid;gap:14px}
.eyebrow{font-family:var(--f-body);font-weight:600;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
h1{font-family:var(--f-display);font-weight:400;font-size:28px;line-height:1.05;margin:2px 0 0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{display:grid;gap:2px}
.stat b{font-family:var(--f-body);font-size:24px;font-weight:700;color:var(--brand-text);font-variant-numeric:tabular-nums;line-height:1}
.stat span{font-size:11px;color:var(--muted);line-height:1.2}
.filters{display:grid;gap:8px}
.search{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border:1px solid var(--line);border-radius:999px;background:transparent;cursor:pointer;font-size:12.5px}
.chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="false"]{opacity:.45}
.chip[aria-pressed="false"] .dot{background:transparent;border:1.5px solid var(--c)}
.row-ctl{display:flex;gap:8px;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.row-ctl select{padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}

.list{overflow-y:auto;min-height:0;flex:1;padding-block:4px 16px}
.item{display:grid;grid-template-columns:10px 1fr auto;gap:4px 12px;align-items:start;width:100%;text-align:left;padding:10px 18px 10px max(18px,env(safe-area-inset-left,0px));border:0;border-bottom:1px solid var(--line);background:transparent;cursor:pointer}
.item:hover{background:var(--water-soft)}
.item[aria-current="true"]{background:var(--water-soft);box-shadow:inset 3px 0 0 var(--water)}
.item .dot{width:10px;height:10px;border-radius:50%;background:var(--c);margin-top:5px}
.item .nm{font-weight:600;min-width:0}
.item .meta{grid-column:2;font-size:12px;color:var(--muted)}
.item .res{grid-row:1/3;grid-column:3;text-align:right;font-family:var(--f-mono);font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);white-space:nowrap}
.item .res b{display:block;font-size:14px;color:var(--ink);font-weight:600}
.nogps{font-family:var(--f-mono);font-size:10px;letter-spacing:.04em;padding:1px 5px;border-radius:3px;border:1px solid var(--warn);color:var(--warn);margin-left:6px;vertical-align:1px}
.empty{padding:24px 18px;color:var(--muted)}

.mapwrap{position:relative;min-width:0;min-height:0}
#map{position:absolute;inset:0;background:var(--sea)}
.leaflet-container{font-family:var(--f-body);background:var(--sea)}
.leaflet-control-zoom a{background:var(--panel)!important;color:var(--ink)!important;border-color:var(--line)!important}
.leaflet-tooltip.tip{background:var(--panel);color:var(--ink);border:1px solid var(--line);box-shadow:0 2px 8px rgb(0 0 0 / .12);font-size:12.5px;padding:4px 8px}
.leaflet-tooltip.tip::before{display:none}
.state-label{font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);white-space:nowrap;pointer-events:none;text-align:center;opacity:.8}
.map-note{position:absolute;left:max(12px,env(safe-area-inset-left,0px));bottom:10px;z-index:500;font-size:11px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:3px 8px;border-radius:4px}

/* Profile drawer */
.profile{position:absolute;top:0;right:0;bottom:0;width:min(620px,100%);background:var(--panel);border-left:1px solid var(--line);z-index:1002;display:flex;flex-direction:column;box-shadow:-12px 0 32px rgb(0 0 0 / .12);transform:translateX(0);transition:transform .22s ease}
.profile[hidden]{display:flex!important;transform:translateX(105%);visibility:hidden;transition:transform .22s ease,visibility 0s .22s}
.p-head{padding:16px max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start}
.p-head h2{font-family:var(--f-display);font-size:30px;font-weight:400;color:var(--brand-text);line-height:1.05;margin:0;text-wrap:balance}
.p-head .sub{grid-column:1;color:var(--muted);font-size:13px;display:flex;flex-wrap:wrap;gap:4px 12px}
.p-head .sub a{color:var(--water)}
.sensor-tag{font-family:var(--f-mono);font-size:12px;padding:2px 7px;border-radius:4px;background:var(--brand);color:#fff;font-weight:600}
.agency-tag{display:inline-flex;align-items:center;gap:6px;font-size:12px}
.agency-tag i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.close{border:1px solid var(--line);background:var(--bg);border-radius:6px;width:34px;height:34px;cursor:pointer;font-size:18px;line-height:1;grid-row:1/3;grid-column:2}
.p-body{overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 32px 20px;display:grid;gap:22px;align-content:start}
.sec-title{font-family:var(--f-body);font-weight:700;font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--brand-2);margin:0 0 10px;display:flex;justify-content:space-between;gap:12px}
.results{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.res-cell{background:var(--panel);padding:12px;display:grid;gap:4px;align-content:start}
.res-cell b{font-family:var(--f-body);font-size:27px;font-weight:700;color:var(--brand-text);line-height:1;font-variant-numeric:tabular-nums}
.res-cell b small{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted);margin-left:3px}
.res-cell span{font-size:12px;color:var(--muted);line-height:1.25}
.bar{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c,var(--water))}
.pending{padding:12px 14px;border:1px dashed var(--line);border-radius:8px;color:var(--muted)}
figure{margin:0}
.fig{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;width:100%;padding:0}
.fig img{display:block;width:100%;height:auto}
.photo .fig{background:var(--land)}
figcaption{font-size:12px;color:var(--muted);margin-top:6px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 20px;margin:0}
.kv div{display:grid;grid-template-columns:minmax(0,46%) 1fr;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);min-width:0}
.kv dt{color:var(--muted);font-size:12.5px}
.kv dd{margin:0;font-weight:500;overflow-wrap:anywhere}
.kv dd.na{color:var(--muted);font-weight:400}
.comments{white-space:pre-wrap;margin:0}
.site-top{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.site-top .fig{aspect-ratio:4/3}
.site-top .fig img{height:100%;object-fit:cover}
.no-photo{aspect-ratio:4/3;border:1px dashed var(--line);border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:12.5px;text-align:center;padding:12px}
.site-top .kv{grid-template-columns:1fr}
.p-actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--water)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.45;cursor:default}

/* Tabs */
.tabs{display:flex;gap:4px;padding:3px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.tab{flex:1;padding:6px 10px;border:0;border-radius:6px;background:transparent;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:6px}
.tab[aria-selected="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .08)}
.tab .n{font-family:var(--f-mono);font-size:11px;padding:0 6px;border-radius:999px;background:var(--water-soft);color:var(--water)}

/* list rows with compare checkbox */
.row{display:grid;grid-template-columns:auto 1fr;align-items:stretch;border-bottom:1px solid var(--line)}
.row .item{border-bottom:0;padding-left:6px}
.pick{display:grid;place-items:center;padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:4px;cursor:pointer}
.pick input{width:16px;height:16px;accent-color:var(--water);cursor:pointer;margin:0}
.row:has(.item[aria-current="true"]){box-shadow:inset 3px 0 0 var(--water);background:var(--water-soft)}
.row .item[aria-current="true"]{box-shadow:none;background:transparent}

/* Compare view */
.compare{position:absolute;inset:0;z-index:1001;background:var(--bg);display:flex;flex-direction:column}
.c-head{padding:16px max(20px,env(safe-area-inset-right,0px)) 14px 20px;border-bottom:1px solid var(--line);background:var(--panel);display:grid;gap:10px}
.c-head h2{font-family:var(--f-display);font-size:26px;font-weight:400;color:var(--brand-text);margin:0;line-height:1.1}
.c-head .bar-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.c-chips{display:flex;flex-wrap:wrap;gap:6px}
.c-chip{display:inline-flex;align-items:center;gap:6px;padding:3px 4px 3px 10px;border:1px solid var(--line);border-radius:999px;background:var(--bg);font-size:12.5px}
.c-chip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.c-chip button{border:0;background:transparent;cursor:pointer;width:20px;height:20px;border-radius:50%;color:var(--muted);font-size:14px;line-height:1}
.c-chip button:hover{background:var(--water-soft);color:var(--ink)}
.c-body{overflow-y:auto;padding:18px max(20px,env(safe-area-inset-right,0px)) 32px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start}
.c-body > section{min-width:0}
.metrics{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.metric{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;align-content:start;min-width:0}
.metric h3{margin:0;font-size:13.5px;font-weight:600;display:flex;justify-content:space-between;gap:8px}
.metric h3 span{font-family:var(--f-mono);font-size:11px;font-weight:400;color:var(--muted)}
.mrow{display:grid;grid-template-columns:minmax(70px,34%) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.mrow .lbl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .track{height:14px;background:var(--water-soft);border-radius:3px;overflow:hidden}
.mrow .track i{display:block;height:100%;background:var(--c);border-radius:3px}
.mrow .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;min-width:5ch;text-align:right}
.mrow.best .val{font-weight:600}
.mrow .na{color:var(--muted)}
.ctable-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.ctable{border-collapse:collapse;width:100%;font-size:12.5px;font-variant-numeric:tabular-nums}
.ctable th,.ctable td{padding:8px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
.ctable thead th{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;position:sticky;top:0;background:var(--panel)}
.ctable td.num{text-align:right;font-family:var(--f-mono)}
.ctable th.num{text-align:right}
.ctable tbody tr:last-child td{border-bottom:0}
.ctable .site-cell{display:flex;align-items:center;gap:8px}
.ctable .site-cell i{width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.ctable a{color:var(--water);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.c-empty{max-width:520px;display:grid;gap:12px;padding:12px 0}
.c-empty p{margin:0;color:var(--muted)}
.c-empty .quick{display:flex;flex-wrap:wrap;gap:8px}
.scale-note{font-size:12px;color:var(--muted);margin:0}

.lightbox{position:fixed;inset:0;z-index:2000;background:rgb(8 14 16 / .88);display:grid;place-items:center;padding:max(24px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(24px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));cursor:zoom-out}
.lightbox img{max-width:100%;max-height:100%;border-radius:6px;background:#fff}

@media (max-width:760px){
  .topbar{padding-block:10px;gap:8px 12px}
  .topbar h1{font-size:22px}
  .topbar .eyebrow{display:none}
  .topbar .tabs{order:3;flex:1 1 100%}
  .topbar .data-bar{margin-left:0;order:2}
  .app{grid-template-columns:1fr;grid-template-rows:46% 1fr}
  .mapwrap{grid-row:1;position:static}
  #map{position:relative;height:100%}
  .side{grid-row:2;border-right:0;border-top:1px solid var(--line)}
  .side-head{padding-right:max(16px,env(safe-area-inset-right,0px));padding-left:max(16px,env(safe-area-inset-left,0px));gap:10px}
  h1{font-size:22px}
  .profile{position:fixed;width:100%;border-left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .p-head{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .p-body{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .results{grid-template-columns:repeat(2,1fr)}
  .kv{grid-template-columns:1fr}
  .site-top{grid-template-columns:1fr}
  .compare{position:fixed;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .c-head{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .c-body{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .metrics{grid-template-columns:1fr}
  .map-note{display:none}
}
@media (prefers-reduced-motion:reduce){.profile,.profile[hidden]{transition:none}}

/* Data bar, dialog, summary, notes */
.data-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.data-bar .src{display:inline-flex;align-items:center;gap:6px;min-width:0}
.data-bar .src i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.data-bar .src.live i{background:var(--good)}
.data-bar .btns{display:flex;gap:6px}
.btn.sm{padding:4px 9px;font-size:12px}
.dlg{position:fixed;inset:0;z-index:3000;background:rgb(8 14 16 / .55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.dlg-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(560px,100%);max-height:100%;overflow:auto;padding:20px;display:grid;gap:14px;box-shadow:0 20px 50px rgb(0 0 0 / .25)}
.dlg-card h2{font-family:var(--f-display);font-size:24px;font-weight:400;color:var(--brand-text);margin:0}
.dlg-card p{margin:0;color:var(--muted)}
.drop{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;border:1px dashed var(--line);border-radius:8px;padding:12px}
.drop b{font-weight:600}
.drop .fn{grid-column:1/-1;font-family:var(--f-mono);font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.drop.ok{border-style:solid;border-color:var(--good)}
.drop.bad{border-style:solid;border-color:var(--warn)}
.drop input{max-width:220px;font-size:12px}
.report{font-size:13px;display:grid;gap:6px;margin:0;padding:0;list-style:none}
.report li{display:flex;gap:8px}
.report li::before{content:"";width:6px;height:6px;border-radius:50%;margin-top:7px;flex:none;background:var(--good)}
.report li.warn::before{background:var(--warn)}
.dlg-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--water);width:0;transition:width .2s}
.summary{background:var(--water-soft);border-radius:8px;padding:14px 16px;margin:0;line-height:1.55;max-width:70ch}
.notes{display:grid;gap:12px}
.note{display:grid;grid-template-columns:28px 1fr;gap:4px 10px}
.note img{width:28px;height:28px;border-radius:50%;grid-row:1/3}
.note .who{font-size:12.5px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.note .who b{font-weight:600}
.note .who span{color:var(--muted);font-size:11.5px}
.note .who button{border:0;background:none;color:var(--muted);cursor:pointer;font-size:11.5px;padding:0;text-decoration:underline}
.note p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.composer{display:grid;gap:8px}
.composer textarea{width:100%;min-height:70px;resize:vertical;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font:inherit}
.composer .row-end{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.muted-note{color:var(--muted);font-size:12.5px;margin:0}
.img-tools{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.note .av{width:28px;height:28px;border-radius:50%;grid-row:1/3;display:grid;place-items:center;background:var(--water-soft);color:var(--water);font-weight:600;font-size:12px}
form.composer{position:relative}
.leaflet-control-layers{background:var(--panel)!important;color:var(--ink);border:1px solid var(--line)!important;border-radius:6px!important}
code{font-family:var(--f-mono);font-size:.92em}
</style>

</head>
<body>
<div class="shell">
<header class="topbar">
  <div class="brand">
    <div class="eyebrow">Recharge structure monitoring · Monsoon 2026</div>
    <h1>Pond Sensor Atlas</h1>
  </div>
      <div class="tabs" role="tablist" aria-label="View">
        <button class="tab" id="tab-map" role="tab" aria-selected="true" aria-controls="map">Map</button>
        <button class="tab" id="tab-compare" role="tab" aria-selected="false" aria-controls="compare">Compare <span class="n" id="cmp-n">0</span></button>
      </div>
      <div class="data-bar">
        <span class="src" id="data-src"><i></i><span id="data-status">Loading data…</span></span>
        <span class="btns">
          <a class="btn sm ghost" id="btn-data" hidden target="_blank" rel="noopener">View data sheet</a>
        </span>
      </div>
</header>
<div class="app">
  <aside class="side" aria-label="Sensor sites">
    <div class="side-head">
      <div class="stats" id="stats">
        <div class="stat"><b>—</b><span>sensor sites</span></div>
        <div class="stat"><b>—</b><span>states</span></div>
        <div class="stat"><b>—</b><span>recharge events</span></div>
        <div class="stat"><b>—</b><span>avg data completeness</span></div>
      </div>
      <div class="filters">
        <input id="q" class="search" type="search" placeholder="Search village, district or sensor code" aria-label="Search sites">
        <div class="chips" id="agencies" role="group" aria-label="Monitoring agency"></div>
        <div class="row-ctl">
          <span id="count">Loading sites…</span>
          <label>Sort
            <select id="sort">
              <option value="name">Village A–Z</option>
              <option value="recharge">Recharge per event</option>
              <option value="days">Days water available</option>
              <option value="events">Recharge events</option>
              <option value="sensor">Sensor code</option>
            </select>
          </label>
        </div>
      </div>
    </div>
    <div class="list" id="list" role="list"></div>
  </aside>

  <main class="mapwrap">
    <div id="map" aria-label="Map of sensor sites"></div>
    <section class="compare" id="compare" hidden aria-label="Compare sites" role="tabpanel"></section>
    <section class="profile" id="profile" hidden aria-label="Site profile"></section>
  </main>
</div>
</div>
<div class="lightbox" id="lightbox" hidden><img alt=""></div>
<div class="dlg" id="dlg" hidden role="dialog" aria-modal="true" aria-labelledby="dlg-title"><div class="dlg-card" id="dlg-card"></div></div>


<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const CFG = Object.assign({METADATA_URL:'', RESULTS_URL:'', COMMENTS_URL:'', DATA_LINK:'', TITLE:'', SUBTITLE:''}, window.POND_CONFIG || {});
const AGENCIES = {
  SFO:  {label:'SFO', full:'Sehgal Foundation', v:'--sfo'},
  BAIF: {label:'BAIF', full:'Bharatiya Agro Industries Foundation', v:'--baif'},
  IWMI: {label:'IWMI', full:'International Water Management Institute', v:'--iwmi'},
};
// Excel / Google Sheet column headers → field keys (third value 1 = number)
const META_COLS = [
  ['Sensor Code','id'],['Site Name','name'],['Village','village'],['District','district'],['State','state'],
  ['Latitude','lat',1],['Longitude','lng',1],['Structure Type','structure_type'],['Structure Depth','structure_depth'],
  ['Storage Capacity','storage_capacity'],['Soil Type','soil_type'],['Major Aquifer Type','major_aquifer'],
  ['Minor Aquifer Type','minor_aquifer'],['Monitoring Agency','agency'],['Structure Completion Year','completion_year'],
  ['Desilting (if done)','desilting'],['Last Maintenance / Cleaning','last_maintenance'],['Inlet / Outlet Condition','inlet_outlet'],
  ['Action Recommended','action'],['Nearest Piezometer GWL','piezometer'],['Remarks','comments'],
];
const RES_COLS = [
  ['Sensor Code','id'],['First Reading','first_reading'],['Sampling Interval','interval'],['Data Completeness (%)','completeness',1],
  ['Analysis Period','period'],['Number of Recharge Events','recharge_events',1],['Recharge Rate per Event (mm/day)','recharge_rate',1],
  ['Average Recharge per Event (mm)','avg_recharge',1],['Total Duration Water Available (days)','water_days',1],
  ['Average Water Level (m)','avg_water_level',1],['Avg Water Level Depth from Sensor (m)','avg_depth_sensor'],
  ['Avg Water Level Depth from Bottom (m)','avg_depth_bottom'],
];
const METRICS = [
  {k:'avg_recharge',    label:'Average recharge per event', unit:'mm',     d:1},
  {k:'recharge_rate',   label:'Recharge rate per event',    unit:'mm/day', d:2},
  {k:'recharge_events', label:'Number of recharge events',  unit:'events', d:0},
  {k:'water_days',      label:'Water available in structure', unit:'days', d:0},
  {k:'completeness',    label:'Data completeness',          unit:'%',      d:1, max:100},
];

const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const agencyKey = s => (s.agency||'').split(/[\s(]/)[0].toUpperCase();
const fmt = (n, d=0) => n==null ? '—' : Number(n).toLocaleString('en-IN',{maximumFractionDigits:d, minimumFractionDigits:d});
const esc = s => String(s??'').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);
const store = { get:k=>{try{return localStorage.getItem(k)}catch(e){return null}}, set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}} };

let SITES = [], markers = {}, map, current = null;
const state = {q:'', sort:'name', agencies:new Set(Object.keys(AGENCIES)), view:'map', cmp:new Set()};
try { JSON.parse(store.get('pondCompare')||'[]').forEach(id => state.cmp.add(id)); } catch(e){}
const saveCmp = () => store.set('pondCompare', JSON.stringify([...state.cmp]));
const COMMENTS = {loaded:false, error:false, list:[]};

/* ---------------- data loading ---------------- */
const norm = h => String(h||'').toLowerCase().replace(/[^a-z0-9]/g,'');
function sheetRows(wb, cols){
  let best = null;
  for (const name of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[name], {header:1, defval:null, raw:true, blankrows:false});
    if (!rows.length) continue;
    const hdr = rows[0].map(norm);
    const hits = cols.filter(c => hdr.includes(norm(c[0]))).length;
    if (!best || hits > best.hits) best = {rows, hdr, hits};
  }
  if (!best) throw new Error('The sheet is empty.');
  const idIdx = best.hdr.indexOf(norm('Sensor Code'));
  if (idIdx < 0) throw new Error('No “Sensor Code” column found.');
  const out = [], seen = new Set();
  for (const r of best.rows.slice(1)) {
    const raw = r[idIdx];
    if (raw==null || String(raw).trim()==='') continue;
    const id = String(typeof raw==='number' ? Math.round(raw) : raw).trim();
    if (seen.has(id)) continue; seen.add(id);
    const row = {id};
    for (const [h, k, numeric] of cols) {
      if (k==='id') continue;
      const i = best.hdr.indexOf(norm(h)); if (i<0) { row[k] = null; continue; }
      const v = r[i];
      if (v==null || String(v).trim()==='') { row[k] = null; continue; }
      if (numeric) { const n = Number(String(v).replace(/,/g,'').replace('%','')); row[k] = isNaN(n) ? null : n; }
      else row[k] = v instanceof Date ? v.toLocaleDateString('en-GB') : String(v).trim();
    }
    out.push(row);
  }
  return out;
}
async function readTable(url, cols){
  const res = await fetch(url, {cache:'no-store'});
  if (!res.ok) throw new Error(`Could not open ${url} (${res.status}).`);
  const buf = await res.arrayBuffer(), b = new Uint8Array(buf);
  // .xlsx files are zip archives (start with "PK"); Google's published CSV is UTF-8 text
  const wb = (b[0]===0x50 && b[1]===0x4B) ? XLSX.read(buf, {type:'array', cellDates:true})
    : XLSX.read(new TextDecoder('utf-8').decode(buf).replace(/^\uFEFF/,''), {type:'string', cellDates:true});
  return sheetRows(wb, cols);
}
async function loadData(){
  const metaUrl = CFG.METADATA_URL || 'data/Pond_Sites_Metadata.xlsx';
  const resUrl  = CFG.RESULTS_URL  || 'data/Pond_Sites_Results.xlsx';
  const [meta, res] = await Promise.all([readTable(metaUrl, META_COLS), readTable(resUrl, RES_COLS).catch(e => { console.warn(e); return []; })]);
  const r = Object.fromEntries(res.map(x => [x.id, x]));
  return meta.map(m => { const s = {...m, ...(r[m.id]||{}), id:m.id}; s.ak = agencyKey(s); return s; });
}

/* ---------------- boot ---------------- */
async function boot(){
  if (CFG.TITLE) { document.querySelector('h1').textContent = CFG.TITLE; document.title = CFG.TITLE; }
  if (CFG.SUBTITLE) document.querySelector('.topbar .eyebrow').textContent = CFG.SUBTITLE;
  if (CFG.DATA_LINK) { $('btn-data').href = CFG.DATA_LINK; $('btn-data').hidden = false; }
  renderChips(); initMap();
  try {
    SITES = await loadData();
  } catch(e) {
    console.error(e);
    $('data-status').textContent = 'Could not load site data';
    $('list').innerHTML = `<div class="empty">The site data could not be loaded. ${esc(e.message)} Check the links in config.js, then reload.</div>`;
    return;
  }
  $('data-src').classList.add('live');
  $('data-status').textContent = `${CFG.METADATA_URL ? 'Live from Google Sheets' : 'From Excel files'} · loaded ${new Date().toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}`;
  renderStats(); updateChipCounts(); syncMarkers(); fitToSites(); render(); updateCmpCount();
  const h = decodeURIComponent(location.hash.replace('#',''));
  if (h === 'compare') setView('compare');
  if (h.startsWith('s')) { const s = SITES.find(x => x.id === h.slice(1)); if (s) open(s, false); }
  loadComments();
}

/* ---------------- side panel ---------------- */
function renderStats(){
  const st = new Set(SITES.map(s=>s.state).filter(Boolean)).size;
  const ev = SITES.reduce((a,s)=>a+(s.recharge_events||0),0);
  const comp = SITES.filter(s=>s.completeness!=null);
  const avg = comp.length ? comp.reduce((a,s)=>a+s.completeness,0)/comp.length : null;
  const b = document.querySelectorAll('#stats b');
  b[0].textContent = SITES.length; b[1].textContent = st; b[2].textContent = ev; b[3].textContent = avg!=null ? fmt(avg,0)+'%' : '—';
}
function renderChips(){
  const el = $('agencies');
  el.innerHTML = Object.entries(AGENCIES).map(([k,a]) =>
    `<button class="chip" id="chip-${k}" style="--c:var(${a.v})" aria-pressed="true" data-k="${k}" title="${a.full}"><span class="dot"></span>${a.label} <span class="cnt" style="color:var(--muted)"></span></button>`).join('');
  el.addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    const k = b.dataset.k;
    state.agencies.has(k) ? state.agencies.delete(k) : state.agencies.add(k);
    b.setAttribute('aria-pressed', state.agencies.has(k));
    render();
  });
}
function updateChipCounts(){
  for (const k of Object.keys(AGENCIES)) { const c = document.querySelector(`#chip-${k} .cnt`); if (c) c.textContent = SITES.filter(s=>s.ak===k).length; }
}
function visible(){
  const q = state.q.toLowerCase();
  const known = s => AGENCIES[s.ak] ? state.agencies.has(s.ak) : true;
  const v = SITES.filter(s => known(s) && (!q || [s.name,s.district,s.state,s.id,s.structure_type].join(' ').toLowerCase().includes(q)));
  const by = {
    name:(a,b)=>String(a.name).localeCompare(String(b.name))||a.id-b.id,
    sensor:(a,b)=>a.id-b.id,
    recharge:(a,b)=>(b.avg_recharge??-1)-(a.avg_recharge??-1),
    days:(a,b)=>(b.water_days??-1)-(a.water_days??-1),
    events:(a,b)=>(b.recharge_events??-1)-(a.recharge_events??-1),
  }[state.sort];
  return v.sort(by);
}
function resultLine(s){
  if (state.sort==='days') return s.water_days!=null ? `<b>${fmt(s.water_days)}</b>days` : '<b>—</b>pending';
  if (state.sort==='events') return s.recharge_events!=null ? `<b>${fmt(s.recharge_events)}</b>events` : '<b>—</b>pending';
  return s.avg_recharge!=null ? `<b>${fmt(s.avg_recharge,1)}</b>mm/event` : '<b>—</b>pending';
}
const colorVar = s => `var(${AGENCIES[s.ak]?.v||'--water'})`;
const hasGps = s => s.lat!=null && s.lng!=null && !isNaN(s.lat) && !isNaN(s.lng);

function render(){
  const v = visible(), ids = new Set(v.map(s=>s.id));
  $('count').textContent = `${v.length} of ${SITES.length} sites`;
  $('list').innerHTML = v.length ? v.map(s => `
    <div class="row" role="listitem">
      <label class="pick" title="Add to comparison"><input type="checkbox" id="pick-${esc(s.id)}" data-pick="${esc(s.id)}" ${state.cmp.has(s.id)?'checked':''} aria-label="Compare ${esc(s.name)} (sensor ${esc(s.id)})"></label>
      <button class="item" data-id="${esc(s.id)}" style="--c:${colorVar(s)}" aria-current="${current?.id===s.id}">
        <span class="dot"></span>
        <span class="nm">${esc(s.name)}${hasGps(s)?'':'<span class="nogps">NO GPS</span>'}</span>
        <span class="res">${resultLine(s)}</span>
        <span class="meta">${esc(s.district)}, ${esc(s.state)} · ${esc(s.structure_type)} · <span style="font-family:var(--f-mono)">#${esc(s.id)}</span></span>
      </button>
    </div>`).join('') : '<div class="empty">No sites match. Clear the search or turn an agency back on.</div>';
  for (const [id,m] of Object.entries(markers)) {
    if (ids.has(id)) { if (!map.hasLayer(m)) m.addTo(map); } else m.remove();
  }
}
$('list').addEventListener('click', e => { const b = e.target.closest('.item'); if (b) open(SITES.find(s=>s.id===b.dataset.id), true); });
$('list').addEventListener('change', e => { const id = e.target.dataset.pick; if (id) toggleCmp(id, e.target.checked); });
$('q').addEventListener('input', e => { state.q = e.target.value; render(); });
$('sort').addEventListener('change', e => { state.sort = e.target.value; render(); });

function toggleCmp(id, on){
  on ? state.cmp.add(id) : state.cmp.delete(id);
  saveCmp();
  const cb = $('pick-'+id); if (cb) cb.checked = on;
  const pb = $('p-cmp');
  if (pb && current?.id===id) { pb.classList.toggle('on', on); pb.textContent = on ? '✓ In comparison' : '+ Add to comparison'; }
  updateCmpCount();
  if (state.view==='compare') renderCompare();
}
function updateCmpCount(){ $('cmp-n').textContent = SITES.filter(s => state.cmp.has(s.id)).length; }

function setView(v){
  state.view = v;
  $('tab-map').setAttribute('aria-selected', v==='map');
  $('tab-compare').setAttribute('aria-selected', v==='compare');
  if (v==='compare') { renderCompare(); $('compare').hidden = false; closeProfile(); try { history.replaceState(null,'','#compare'); } catch(e){} }
  else { $('compare').hidden = true; map.invalidateSize(); try { history.replaceState(null,'',location.pathname); } catch(e){} }
}
$('tab-map').addEventListener('click', () => setView('map'));
$('tab-compare').addEventListener('click', () => setView('compare'));

/* ---------------- summaries ---------------- */
const ordinal = n => { const s=['th','st','nd','rd'], v=n%100; return n+(s[(v-20)%10]||s[v]||s[0]); };
function rankOf(s, k){
  const vals = SITES.filter(x => x[k]!=null).sort((a,b)=>b[k]-a[k]);
  const i = vals.findIndex(x => x.id===s.id);
  return i<0 ? null : {r:i+1, n:vals.length};
}
function siteSummary(s){
  if (s.recharge_events==null)
    return `Analysis for ${esc(s.name)} is still pending${s.completeness!=null ? `, with ${fmt(s.completeness,1)}% of expected readings received so far` : ''}.`;
  const r1 = rankOf(s,'avg_recharge'), r2 = rankOf(s,'water_days');
  const comp = s.completeness!=null ? (s.completeness>=85 ? `Data completeness is good at ${fmt(s.completeness,1)}%.` : `Data completeness is ${fmt(s.completeness,1)}%, below the 85% level where results are most reliable.`) : '';
  return `Over ${esc(s.period||'the analysis period')}, this ${esc((s.structure_type||'structure').toLowerCase())} recorded <b>${fmt(s.recharge_events)} recharge event${s.recharge_events==1?'':'s'}</b>, averaging <b>${fmt(s.avg_recharge,1)} mm</b> per event at ${fmt(s.recharge_rate,2)} mm/day, and held water for <b>${fmt(s.water_days)} days</b>. `
    + (r1 ? `That ranks ${ordinal(r1.r)} of ${r1.n} sites on recharge per event` : '')
    + (r2 ? ` and ${ordinal(r2.r)} of ${r2.n} on days of water available. ` : '. ')
    + comp;
}
function compareSummary(sel){
  const withRes = sel.filter(s => s.avg_recharge!=null);
  if (withRes.length < 2) return 'Select at least two sites with results to see a summary.';
  const by = k => [...withRes].filter(s=>s[k]!=null).sort((a,b)=>b[k]-a[k]);
  const med = arr => { const v = arr.map(Number).sort((a,b)=>a-b), m = v.length>>1; return v.length%2 ? v[m] : (v[m-1]+v[m])/2; };
  const r = by('avg_recharge'), d = by('water_days');
  const pend = sel.length - withRes.length;
  return `Across ${withRes.length} sites with results, average recharge per event ranges from <b>${fmt(r.at(-1).avg_recharge,1)} mm</b> (${esc(r.at(-1).name)}) to <b>${fmt(r[0].avg_recharge,1)} mm</b> (${esc(r[0].name)}), with a median of ${fmt(med(r.map(s=>s.avg_recharge)),1)} mm. `
    + (d.length ? `Water stayed in the structures for ${fmt(d.at(-1).water_days)} to ${fmt(d[0].water_days)} days (median ${fmt(med(d.map(s=>s.water_days)))}). ` : '')
    + `They recorded ${fmt(withRes.reduce((a,s)=>a+(s.recharge_events||0),0))} recharge events in total.`
    + (pend ? ` ${pend} selected site${pend>1?'s have':' has'} no results yet.` : '');
}

/* ---------------- comments (Google Apps Script) ---------------- */
async function loadComments(){
  if (!CFG.COMMENTS_URL) return;
  try {
    const r = await fetch(CFG.COMMENTS_URL, {cache:'no-store'});
    const j = await r.json();
    COMMENTS.list = (j.comments||[]).filter(c => c && c.site && c.text);
    COMMENTS.loaded = true; COMMENTS.error = false;
  } catch(e) { console.warn(e); COMMENTS.error = true; }
  refreshNotes();
}
function notesBlock(site, label){
  return `<section><h3 class="sec-title"><span>${label}</span><span id="ncount-${site}"></span></h3>
    <div class="notes" id="notes-${site}" data-site="${site}"></div></section>`;
}
function fillNotes(site){
  const el = $('notes-'+site); if (!el) return;
  if (!CFG.COMMENTS_URL) { el.innerHTML = '<p class="muted-note">Comments are not set up yet. Add the comments link in config.js to switch them on.</p>'; return; }
  const draft = $('ta-'+site)?.value || '';
  el.innerHTML = '';
  if (COMMENTS.error) { const p = document.createElement('p'); p.className='muted-note'; p.textContent='Comments could not be loaded. Reload the page to try again.'; el.append(p); }
  else if (!COMMENTS.loaded) { const p = document.createElement('p'); p.className='muted-note'; p.textContent='Loading comments…'; el.append(p); }
  else {
    const items = COMMENTS.list.filter(c => String(c.site)===String(site)).sort((a,b)=>a.at-b.at);
    if (!items.length) { const p = document.createElement('p'); p.className='muted-note'; p.textContent='No comments yet.'; el.append(p); }
    for (const it of items) {
      const row = document.createElement('div'); row.className = 'note';
      const av = document.createElement('span'); av.className = 'av'; av.textContent = (it.name||'?').trim().charAt(0).toUpperCase();
      const who = document.createElement('div'); who.className = 'who';
      const b = document.createElement('b'); b.textContent = it.name || 'Someone';
      const t = document.createElement('span'); t.textContent = it.at ? new Date(it.at).toLocaleString('en-IN',{day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
      who.append(b, t);
      const txt = document.createElement('p'); txt.textContent = it.text;
      row.append(av, who, txt); el.append(row);
    }
    const n = $('ncount-'+site); if (n) n.textContent = items.length ? `${items.length} comment${items.length>1?'s':''}` : '';
  }
  const box = document.createElement('form'); box.className = 'composer'; box.dataset.site = site;
  box.innerHTML = `<label class="muted-note" for="ta-${site}">Add a comment</label>
    <input id="nm-${site}" class="search" type="text" maxlength="80" placeholder="Your name and organisation" autocomplete="name" required>
    <textarea id="ta-${site}" maxlength="2000" placeholder="Observation, field note or follow-up action" required></textarea>
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px;width:1px;height:1px">
    <div class="row-end"><span class="err" id="err-${site}" role="status"></span><button class="btn primary" type="submit">Post comment</button></div>`;
  box.querySelector('textarea').value = draft;
  box.querySelector('#nm-'+site).value = store.get('pondName') || '';
  el.append(box);
}
function refreshNotes(){ document.querySelectorAll('.notes[data-site]').forEach(n => fillNotes(n.dataset.site)); }

document.addEventListener('submit', async e => {
  const f = e.target.closest('form.composer'); if (!f) return;
  e.preventDefault();
  const site = f.dataset.site, err = $('err-'+site), btn = f.querySelector('button[type=submit]');
  const name = $('nm-'+site).value.trim(), text = $('ta-'+site).value.trim();
  if (!name || !text) { err.textContent = 'Enter your name and a comment.'; return; }
  store.set('pondName', name);
  btn.disabled = true; err.textContent = 'Posting…';
  try {
    const r = await fetch(CFG.COMMENTS_URL, {method:'POST', body: JSON.stringify({site, name, text, website: f.elements.website.value})});
    const j = await r.json().catch(() => ({ok:true}));
    if (j.ok === false) throw new Error(j.error);
    $('ta-'+site).value = '';
    COMMENTS.list.push({site, name, text, at: Date.now()});
    fillNotes(site);
    setTimeout(loadComments, 1500);
  } catch(x) {
    err.textContent = 'Could not post. Check your connection and try again.';
    btn.disabled = false;
  }
});

/* ---------------- compare view ---------------- */
function renderCompare(){
  const sel = SITES.filter(s => state.cmp.has(s.id));
  const draft = $('ta-_general')?.value;
  const head = `
    <header class="c-head">
      <div class="bar-row">
        <h2>Compare sites</h2>
        <div style="display:flex;gap:8px">
          ${sel.length ? '<button class="btn ghost" id="c-clear">Clear all</button>' : ''}
          <button class="btn" id="c-back">← Back to map</button>
        </div>
      </div>
      ${sel.length ? `<div class="c-chips">${sel.map(s => `<span class="c-chip" style="--c:${colorVar(s)}"><i></i>${esc(s.name)} <span style="font-family:var(--f-mono);color:var(--muted)">#${esc(s.id)}</span><button data-rm="${esc(s.id)}" aria-label="Remove ${esc(s.name)}">×</button></span>`).join('')}</div>` : ''}
    </header>`;
  let body;
  if (!sel.length) {
    body = `<div class="c-empty">
      <p>Tick the box beside any site in the list, or use “Add to comparison” in a site profile. The selected sites appear here side by side on recharge, water availability and data completeness.</p>
      <p>Or start from a group:</p>
      <div class="quick">
        <button class="btn" data-quick="SFO">All SFO ponds</button>
        <button class="btn" data-quick="IWMI">All IWMI ponds</button>
        <button class="btn" data-quick="Maharashtra">Maharashtra sites</button>
        <button class="btn" data-quick="top">Top 6 by recharge per event</button>
      </div></div>`;
  } else {
    const panels = METRICS.map(m => {
      const vals = sel.map(s => s[m.k]).filter(v => v!=null);
      const max = m.max || Math.max(...vals, 0) || 1;
      const best = vals.length ? Math.max(...vals) : null;
      const rows = [...sel].sort((a,b)=>(b[m.k]??-1)-(a[m.k]??-1)).map(s => {
        const v = s[m.k];
        return `<div class="mrow ${v!=null && v===best && sel.length>1 ? 'best':''}">
          <span class="lbl" title="${esc(s.name)} #${esc(s.id)}">${esc(s.name)} <span style="color:var(--muted);font-family:var(--f-mono);font-size:11px">#${esc(s.id)}</span></span>
          <span class="track">${v!=null ? `<i style="width:${Math.max(1, v/max*100).toFixed(1)}%;background:${colorVar(s)}"></i>` : ''}</span>
          <span class="val ${v==null?'na':''}">${v!=null ? fmt(v,m.d) : 'n/a'}</span>
        </div>`;
      }).join('');
      return `<div class="metric"><h3>${m.label}<span>${m.unit}</span></h3>${rows}</div>`;
    }).join('');
    const table = `<div class="ctable-wrap"><table class="ctable">
        <thead><tr><th>Site</th><th>Structure</th><th>District</th><th>Agency</th>
          ${METRICS.map(m=>`<th class="num">${m.label.replace('Number of ','')} (${m.unit})</th>`).join('')}
          <th>Analysis period</th></tr></thead>
        <tbody>${sel.map(s => `<tr>
          <td><span class="site-cell" style="--c:${colorVar(s)}"><i></i><a data-open="${esc(s.id)}">${esc(s.name)}</a> <span style="color:var(--muted);font-family:var(--f-mono)">#${esc(s.id)}</span></span></td>
          <td>${esc(s.structure_type)}</td><td>${esc(s.district)}, ${esc(s.state)}</td><td>${esc(s.ak)}</td>
          ${METRICS.map(m=>`<td class="num">${s[m.k]!=null?fmt(s[m.k],m.d):'—'}</td>`).join('')}
          <td>${esc(s.period||'')}</td></tr>`).join('')}</tbody>
      </table></div>`;
    body = `
      <section><h3 class="sec-title"><span>Key results</span><span>${sel.length} site${sel.length>1?'s':''}</span></h3>
        <div class="metrics">${panels}</div>
        <p class="scale-note" style="margin-top:10px">Bars are scaled to the highest selected value (completeness to 100%). Bar colour shows the monitoring agency. Analysis periods differ by site, so check the table before comparing totals.</p></section>
      <section><h3 class="sec-title"><span>Side-by-side table</span><span>Select a name to open its profile</span></h3>${table}</section>
      <section><h3 class="sec-title"><span>Summary</span></h3><p class="summary">${compareSummary(sel)}</p></section>`;
  }
  $('compare').innerHTML = head + `<div class="c-body">${body}${notesBlock('_general','General discussion · all sites')}</div>`;
  fillNotes('_general');
  if (draft && $('ta-_general')) $('ta-_general').value = draft;
}
$('compare').addEventListener('click', e => {
  const t = e.target;
  if (t.id==='c-back') return setView('map');
  if (t.id==='c-clear') { [...state.cmp].forEach(id => toggleCmp(id,false)); return; }
  if (t.dataset.rm) return toggleCmp(t.dataset.rm, false);
  if (t.dataset.open) return open(SITES.find(s=>s.id===t.dataset.open), false);
  if (t.dataset.quick) {
    const q = t.dataset.quick;
    const pick = q==='top' ? [...SITES].filter(s=>s.avg_recharge!=null).sort((a,b)=>b.avg_recharge-a.avg_recharge).slice(0,6)
      : SITES.filter(s => s.ak===q || s.state===q);
    pick.forEach(s => state.cmp.add(s.id)); saveCmp(); updateCmpCount(); render(); renderCompare();
  }
});

/* ---------------- map ---------------- */
function initMap(){
  map = L.map('map', {zoomSnap:.25, minZoom:4, maxZoom:18}).setView([23.5, 78], 5);
  const street = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
  const sat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {maxZoom:19,
    attribution:'Imagery &copy; Esri, Maxar, Earthstar Geographics'});
  (store.get('pondLayer')==='sat' ? sat : street).addTo(map);
  L.control.layers({'Map': street, 'Satellite': sat}, null, {position:'topleft'}).addTo(map);
  map.on('baselayerchange', e => store.set('pondLayer', e.layer===sat ? 'sat' : 'map'));
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', restyle);
}
function fitToSites(){
  const pts = SITES.filter(hasGps).map(s=>[s.lat,s.lng]);
  if (pts.length) map.fitBounds(pts, {padding:[40,40]});
}
function syncMarkers(){
  for (const m of Object.values(markers)) m.remove();
  markers = {};
  for (const s of SITES) {
    if (!hasGps(s)) continue;
    const m = L.circleMarker([s.lat,s.lng], markerStyle(s, current?.id===s.id));
    m.bindTooltip(`<b>${esc(s.name)}</b> · #${esc(s.id)}<br><span style="color:var(--muted)">${esc(s.structure_type)}</span>`, {className:'tip', direction:'top', offset:[0,-6]});
    m.on('click', () => open(SITES.find(x=>x.id===s.id), false));
    markers[s.id] = m;
  }
}
function markerStyle(s, active){
  return {radius: active?10:7, color: active?'#14262a':'#ffffff', weight: active?3:2, fillColor:css(AGENCIES[s.ak]?.v || '--water'), fillOpacity:.95};
}
function restyle(){ for (const s of SITES) markers[s.id]?.setStyle(markerStyle(s, current?.id===s.id)); }

/* ---------------- profile ---------------- */
function kv(rows){
  return `<dl class="kv">${rows.map(([k,v]) => {
    const na = v==null || v==='';
    return `<div><dt>${k}</dt><dd class="${na?'na':''}">${na?'Not recorded':esc(v)}</dd></div>`;
  }).join('')}</dl>`;
}
// Photos: img/<Sensor Code>_site.jpg and img/<Sensor Code>_chart.jpg (.png also works)
function imgFail(el){
  if (el.src.endsWith('.jpg')) { el.src = el.src.replace(/\.jpg$/, '.png'); return; }
  const box = el.closest('[data-img-box]');
  if (box) box.innerHTML = `<div class="${box.dataset.imgBox==='photo'?'no-photo':'pending'}">No ${box.dataset.imgBox==='photo'?'site photo':'chart'} yet. Add <code>img/${esc(box.dataset.id)}_${box.dataset.imgBox==='photo'?'site':'chart'}.jpg</code> to the website folder.</div>`;
}
window.imgFail = imgFail;

function open(s, fly){
  if (!s) return;
  if (current && markers[current.id]) markers[current.id].setStyle(markerStyle(current,false));
  current = s;
  const m = markers[s.id];
  if (m) { m.setStyle(markerStyle(s,true)); m.bringToFront();
    const z = Math.max(map.getZoom(), 12), target = map.project([s.lat,s.lng], z);
    if (innerWidth > 760) target.x += Math.min(620, map.getSize().x) / 2 * 0.9;
    map.flyTo(map.unproject(target, z), z, {duration: matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : .8});
  }
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', b.dataset.id===s.id));
  try { history.replaceState(null,'','#s'+s.id); } catch(e){}

  const a = AGENCIES[s.ak] || {v:'--water'};
  const hasRes = s.recharge_events!=null;
  const gmaps = hasGps(s) ? `<a href="https://www.google.com/maps?q=${s.lat},${s.lng}" target="_blank" rel="noopener">${Number(s.lat).toFixed(5)}° N, ${Number(s.lng).toFixed(5)}° E ↗</a>` : '<span class="nogps" style="margin:0">Coordinates not available</span>';
  const maxDays = Math.max(...SITES.map(x=>x.water_days||0), 1);
  const maxRec = Math.max(...SITES.map(x=>x.avg_recharge||0), 1);
  const photo = `img/${encodeURIComponent(s.id)}_site.jpg`, chart = `img/${encodeURIComponent(s.id)}_chart.jpg`;
  const p = $('profile');
  p.innerHTML = `
    <header class="p-head">
      <h2>${esc(s.name)}</h2>
      <button class="close" id="close" aria-label="Close profile">×</button>
      <div class="sub">
        <span class="sensor-tag">Sensor ${esc(s.id)}</span>
        <span>${esc(s.district)}, ${esc(s.state)}</span>
        ${s.agency ? `<span class="agency-tag" style="--c:var(${a.v})"><i></i>${esc(s.agency)}</span>` : ''}
        <span>${gmaps}</span>
      </div>
      <div class="p-actions">
        <button class="btn ${state.cmp.has(s.id)?'on':''}" id="p-cmp">${state.cmp.has(s.id)?'✓ In comparison':'+ Add to comparison'}</button>
      </div>
    </header>
    <div class="p-body">
      <section><h3 class="sec-title"><span>Site details</span><span>${esc(s.structure_type)}</span></h3>
        <div class="site-top">
          <div data-img-box="photo" data-id="${esc(s.id)}"><figure class="photo"><button class="fig" data-zoom="${photo}" aria-label="Enlarge photo"><img src="${photo}" alt="Photo of ${esc(s.name)}" onerror="imgFail(this)"></button></figure></div>
          ${kv([['State',s.state],['District',s.district],['Village',s.village],['Structure type',s.structure_type],
                ['Structure depth',s.structure_depth],['Storage capacity',s.storage_capacity]])}
        </div>
        <div style="margin-top:6px">${kv([['Major aquifer',s.major_aquifer],['Minor aquifer',s.minor_aquifer],['Soil type',s.soil_type],['Completion year',s.completion_year]])}</div>
      </section>
      <section>
        <h3 class="sec-title"><span>Results analysis</span><span>${esc(s.period||'')}</span></h3>
        ${hasRes ? `<div class="results">
          <div class="res-cell"><b>${fmt(s.recharge_events)}</b><span>Recharge events</span></div>
          <div class="res-cell"><b>${fmt(s.recharge_rate,2)}<small>mm/day</small></b><span>Recharge rate per event</span></div>
          <div class="res-cell"><b>${fmt(s.avg_recharge,1)}<small>mm</small></b><span>Average recharge per event</span>
            <div class="bar" title="Relative to the highest site"><i style="width:${((s.avg_recharge||0)/maxRec*100).toFixed(0)}%"></i></div></div>
          <div class="res-cell"><b>${fmt(s.water_days)}<small>days</small></b><span>Water available in structure</span>
            <div class="bar"><i style="width:${((s.water_days||0)/maxDays*100).toFixed(0)}%"></i></div></div>
          <div class="res-cell"><b>${fmt(s.completeness,1)}<small>%</small></b><span>Data completeness</span>
            <div class="bar" style="--c:var(${s.completeness>=85?'--good':'--warn'})"><i style="width:${s.completeness||0}%"></i></div></div>
          <div class="res-cell"><b>${s.avg_water_level!=null?fmt(s.avg_water_level,2)+'<small>m</small>':'—'}</b><span>Average water level</span></div>
        </div>` : `<div class="pending">Analysis not yet available${s.completeness!=null?`. Data completeness so far ${fmt(s.completeness,1)}%`:''}.</div>`}
      </section>
      <section><h3 class="sec-title"><span>Water level &amp; cumulative recharge</span><span>${esc(s.interval||'')} readings</span></h3>
        <div data-img-box="chart" data-id="${esc(s.id)}"><figure><button class="fig" data-zoom="${chart}" aria-label="Enlarge chart"><img src="${chart}" alt="Water level chart for sensor ${esc(s.id)}" loading="lazy" onerror="imgFail(this)"></button>
        <figcaption>Bars show pond water level (m); the line shows cumulative recharge (mm) per event. Tap to enlarge.</figcaption></figure></div>
      </section>
      <section><h3 class="sec-title"><span>Monitoring</span></h3>${kv([
        ['Sensor code',s.id],['First reading',s.first_reading],['Sampling interval',s.interval],['Data completeness',s.completeness!=null?s.completeness+'%':null],
        ['Avg depth from sensor',s.avg_depth_sensor],['Avg depth from bottom',s.avg_depth_bottom],['Nearest piezometer GWL',s.piezometer]])}</section>
      <section><h3 class="sec-title"><span>Management</span></h3>${kv([
        ['Monitoring agency',s.agency],['Desilting',s.desilting],['Last maintenance',s.last_maintenance],
        ['Inlet / outlet',s.inlet_outlet],['Action recommended',s.action]])}</section>
      ${s.comments ? `<section><h3 class="sec-title"><span>Remarks</span></h3><p class="comments">${esc(s.comments)}</p></section>` : ''}
      <section><h3 class="sec-title"><span>Summary</span></h3><p class="summary">${siteSummary(s)}</p></section>
      ${notesBlock(s.id, 'Comments')}
    </div>`;
  p.hidden = false;
  p.querySelector('.p-body').scrollTop = 0;
  $('close').onclick = closeProfile;
  $('p-cmp').onclick = () => toggleCmp(s.id, !state.cmp.has(s.id));
  fillNotes(s.id);
}
function closeProfile(){
  $('profile').hidden = true;
  if (current && markers[current.id]) markers[current.id].setStyle(markerStyle(current,false));
  current = null;
  document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-current', false));
  if (state.view==='map') try { history.replaceState(null,'',location.pathname); } catch(e){}
}
document.addEventListener('keydown', e => {
  if (e.key!=='Escape') return;
  if (!$('lightbox').hidden) $('lightbox').hidden = true; else if (current) closeProfile();
});
$('profile').addEventListener('click', e => {
  const z = e.target.closest('[data-zoom]');
  if (z) { $('lightbox').querySelector('img').src = z.querySelector('img')?.src || z.dataset.zoom; $('lightbox').hidden = false; }
});
$('lightbox').addEventListener('click', e => e.currentTarget.hidden = true);

boot();
</script>
</body>
</html>
